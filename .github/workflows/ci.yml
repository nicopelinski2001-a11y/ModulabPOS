name: Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: modulab_admin
          POSTGRES_PASSWORD: ci-admin-password-only
          POSTGRES_DB: modulab_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U modulab_admin -d modulab_ci" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      ADMIN_DATABASE_URL: postgresql://modulab_admin:ci-admin-password-only@localhost:5432/modulab_ci
      DATABASE_URL: postgresql://modulab_app:ci-app-password-only@localhost:5432/modulab_ci
      APP_DATABASE_PASSWORD: ci-app-password-only
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      APP_ORIGIN: http://localhost:5173
      SEED_PASSWORD: ci-evaluation-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:integration
      - run: npm run db:migrate && npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
      - run: |
          npm run backup
          backup_file="$(find backups -maxdepth 1 -name '*.dump' -type f | sort | tail -n 1)"
          npm run backup:verify -- "$backup_file"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
